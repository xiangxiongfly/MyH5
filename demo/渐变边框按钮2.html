<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>渐变边框按钮</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1e1f26;
        }

        a {
            text-decoration: none;
            color: #fff;
        }

        .btn {
            position: relative;
            width: 140px;
            height: 60px;
            line-height: 60px;
            border: 1px solid #333;
            border-radius: 10px;
            margin: 100px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background-image: conic-gradient(transparent, transparent, transparent, #00ccff);
            z-index: -1;
            animation: anim 1s linear infinite;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 3px;
            background-color: #000;
            border-radius: 10px;
            z-index: -1;
        }

        @keyframes anim {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
<a href="#" class="btn">
    <span>开始按钮</span>
</a>
</body>
</html>
