<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>自动高亮目录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ul {
            list-style: none;
        }

        a {
            text-decoration: none;
        }

        body {
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            gap: 30px;
        }

        .catalog {
            position: sticky;
            top: 20px;
            width: 250px;
            height: fit-content;
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        .catalog h3 {
            margin-bottom: 12px;
            color: #333;
            font-size: 16px;
        }

        .catalog li {
            margin: 8px 0;
        }

        .catalog li a {
            display: block;
            padding: 6px 10px;
            color: #666;
            border-radius: 4px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .catalog li a.active {
            background-color: #409eff;
            color: #fff;
            font-weight: bold;
        }

        .content {
            flex: 1;
        }

        .content .section {
            margin-bottom: 60px;
            padding: 30px;
            border: 1px solid #eee;
            border-radius: 8px;
            min-height: 400px;
        }

        .content .section h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .content .section p {
            line-height: 1.8;
            color: #555;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
<div class="catalog">
    <h3>目录</h3>
    <ul>
        <li><a data-target="section1">第一章 春山行</a></li>
        <li><a data-target="section2">第二章 夜泊江村</a></li>
        <li><a data-target="section3">第三章 边塞吟</a></li>
        <li><a data-target="section4">第四章 秋思</a></li>
    </ul>
</div>
<div class="content">
    <div id="section1" class="section">
        <h2>第一章 春山行</h2>
        <p>青山隐隐水迢迢，</p>
        <p>柳絮飞花逐晚潮。</p>
        <p>独立溪桥听鸟语，</p>
        <p>春风不解客心焦。</p>
    </div>
    <div id="section2" class="section">
        <h2>第二章 夜泊江村</h2>
        <p>江月如钩照水寒，</p>
        <p>渔火几点映波间。</p>
        <p>夜深人静橹声远，</p>
        <p>一曲乡音到客船。</p>
    </div>
    <div id="section3" class="section">
        <h2>第三章 边塞吟</h2>
        <p>黄沙千里接长天，</p>
        <p>胡马嘶风过雁边。</p>
        <p>戍鼓声声催落日，</p>
        <p>征人何日返家园？</p>
    </div>
    <div id="section4" class="section">
        <h2>第四章 秋思</h2>
        <p>梧桐叶落满庭阶，</p>
        <p>雁字南飞带客怀。</p>
        <p>独倚西楼望故里，</p>
        <p>一帘秋雨一帘愁。</p>
    </div>
</div>
<script>
    const catalogItems = document.querySelectorAll(".catalog a");
    const sections = document.querySelectorAll(".section");
    let isClick = false;

    catalogItems.forEach(item => {
        item.addEventListener("click", (e) => {
            isClick = true;
            catalogItems.forEach(item => {
                item.classList.remove("active");
            });
            item.classList.add("active");

            const targetId = item.dataset.target;
            const targetSection = document.getElementById(targetId);
            targetSection.scrollIntoView({behavior: "smooth", block: "start"});
            setTimeout(() => {
                isClick = false;
            }, 800);
        });
    });

    function onScrollListener() {
        if (isClick) return;
        let currentId = sections[0].id; // 默认第一个
        const threshold = 80; // 距离顶部位置

        for (let i = sections.length - 1; i >= 0; i--) {
            const section = sections[i];
            const rect = section.getBoundingClientRect(); // 获取元素在可视区域的位置
            if (rect.top <= threshold) {
                currentId = section.id;
                break;
            }
        }

        const documentHeight = document.documentElement.scrollHeight; // 页面高度
        const windowHeight = window.innerHeight; // 视口高度
        // 滚动到底部时
        if (window.scrollY + windowHeight + 10 >= documentHeight) {
            currentId = sections[sections.length - 1].id;
        }

        console.log("currentId=", currentId);
        catalogItems.forEach(item => {
            item.classList.remove("active");
            if (item.dataset.target === currentId) {
                item.classList.add("active");
            }
        });
    }

    window.addEventListener("scroll", onScrollListener);
    window.addEventListener("load", onScrollListener);
</script>
</body>
</html>
