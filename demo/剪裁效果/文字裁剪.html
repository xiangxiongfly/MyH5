<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>文字裁剪</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #222;
        }

        h1 {
            color: #292929;
            font-size: 200px;
            position: relative;
        }

        h1:after {
            content: "HELLOWORLD";
            position: absolute;
            color: transparent;
            top: 0;
            left: 0;
            background: linear-gradient(to right, #ff69b3, #fe0000, #ffa401, #ffff01, #008102, #40e1d2, #410898, #9400d4);
            /*裁剪文字*/
            background-clip: text;
            clip-path: circle(100px at 0% 50%);
            animation: anim 5s linear infinite;
        }

        @keyframes anim {
            0% {
                clip-path: circle(100px at 0% 50%);
            }
            50% {
                clip-path: circle(100px at 100% 50%);
            }
            100% {
                clip-path: circle(100px at 0% 50%);
            }
        }
    </style>
</head>
<body>
<h1>HELLOWORLD</h1>
</body>
</html>
