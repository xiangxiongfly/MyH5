<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>backdrop-filter</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        img {
            display: block;
            width: 100%;
        }

        .navbar {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 120px;
            background-color: transparent;
            backdrop-filter: saturate(150%) blur(28px);
        }
    </style>
</head>
<body>
<div class="navbar"></div>
<img src="../../assets/images/pic1.png" alt="">
<img src="../../assets/images/pic2.png" alt="">
</body>
</html>
