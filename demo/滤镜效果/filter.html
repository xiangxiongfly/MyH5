<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>filter</title>
    <style>
        figure {
            float: left;
            width: 200px;
            text-align: center;
            border: 1px dashed silver;
        }

        figure img {
            width: 100%;
        }

        .brightness {
            filter: brightness(200%);
        }

        .grayscale {
            filter: grayscale(100%);
        }

        .sepia {
            filter: sepia(100%);
        }

        .invert {
            filter: invert(100%);
        }

        .hue-rotate {
            filter: hue-rotate(180deg);
        }

        .drop-shadow {
            filter: drop-shadow(5px 5px 10px red);
        }

        .opacity {
            filter: opacity(50%);
        }

        .blur {
            filter: blur(5px);
        }

        .contrast {
            filter: contrast(200%);
        }

        .saturate {
            filter: saturate(300%);
        }

        .filter {
            filter: brightness(120%) contrast(200%) blur(1px);
        }
    </style>
</head>
<body>
<figure>
    <img src="../../assets/images/person.png" alt=""/>
    <figcaption>原图</figcaption>
</figure>
<figure>
    <img class="brightness" src="../../assets/images/person.png" alt=""/>
    <figcaption>brightness 亮度</figcaption>
</figure>
<figure>
    <img class="grayscale" src="../../assets/images/person.png" alt=""/>
    <figcaption>grayscale 灰度</figcaption>
</figure>
<figure>
    <img class="sepia" src="../../assets/images/person.png" alt=""/>
    <figcaption>sepia 复古</figcaption>
</figure>
<figure>
    <img class="invert" src="../../assets/images/person.png" alt=""/>
    <figcaption>invert 反色</figcaption>
</figure>
<figure>
    <img class="hue-rotate" src="../../assets/images/person.png" alt=""/>
    <figcaption>hue-rotate 旋转</figcaption>
</figure>
<figure>
    <img class="drop-shadow" src="../../assets/images/person.png" alt=""/>
    <figcaption>drop-shadow 阴影</figcaption>
</figure>
<figure>
    <img class="opacity" src="../../assets/images/person.png" alt=""/>
    <figcaption>opacity 透明度</figcaption>
</figure>
<figure>
    <img class="blur" src="../../assets/images/person.png" alt=""/>
    <figcaption>blur 模糊度</figcaption>
</figure>
<figure>
    <img class="contrast" src="../../assets/images/person.png" alt=""/>
    <figcaption>contrast 对比度</figcaption>
</figure>
<figure>
    <img class="saturate" src="../../assets/images/person.png" alt=""/>
    <figcaption>saturate 饱和度</figcaption>
</figure>
<figure>
    <img class="filter" src="../../assets/images/person.png" alt=""/>
    <figcaption>filter 多种滤镜</figcaption>
</figure>
</body>
</html>
