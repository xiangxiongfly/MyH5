<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>box-reflect</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .box {
            width: 200px;
            height: 150px;
            margin: 100px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff7e5f, #feb47b);
            border-radius: 10px;
            -webkit-box-reflect: below 8px linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            box-reflect: below 8px linear-gradient(transparent, rgba(0, 0, 0, 0.9));
        }
    </style>
</head>
<body>
<div class="box">
    hello world
</div>
</body>
</html>
