<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>animation-timeline 滚动时间线</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .navbar .scrollbar {
            width: 0%;
            height: 3px;
            background: linear-gradient(90deg, #96f, #bf70ff, #e67aff, #ff89dc, #ffa176, #ffb90f);
            animation: anim 2s linear forwards;
            animation-timeline: scroll();
        }

        .content {
            width: 100%;
            height: 1500px;
            padding-top: 100px;
        }

        @keyframes anim {
            from {
                width: 0;
            }

            to {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="navbar">
    <div class="scrollbar"></div>
</div>
