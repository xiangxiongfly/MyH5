<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>变形组合使用</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .box {
            width: 800px;
            height: 100px;
            border: 1px solid #f00;
            margin: 100px auto;
        }

        .wheel {
            width: 100px;
            transition: all 2s;
        }

        .box:hover .wheel {
            transform: translateX(700px) rotate(360deg);
        }
    </style>
</head>
<body>
<div class="box">
    <img src="../../../assets/images/car/wheel.webp" alt="" class="wheel">
</div>
</body>
</html>
