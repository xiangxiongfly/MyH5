<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>过渡效果-3D翻转</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .box {
            position: relative;
            width: 300px;
            height: 450px;
            border: 1px solid red;
            margin: 100px auto;
            perspective: 1000px;
        }

        .box > div {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: pink;
            text-align: center;
            font-size: 30px;
            color: #fff;
            line-height: 450px;
            backface-visibility: hidden;
            transform-style: preserve-3d;
            transition: all 1s;
        }

        .box .front {
            z-index: 1;
        }

        .box .front h3 {
            /*前移文字*/
            transform: translateZ(60px);
            /*翻转到后面隐藏盒子*/
            backface-visibility: hidden;
        }

        .box:hover .front {
            transform: rotateY(-180deg);
        }

        .box .back {
            padding-top: 100px;
            background-color: skyblue;
            transform: rotateY(180deg);
        }

        .box .back p {
            line-height: 40px;
            font-size: 20px;
            transform: translateZ(60px);
            backface-visibility: hidden;
        }

        .box:hover .back {
            transform: rotateY(0deg);
        }
    </style>
</head>
<body>
<div class="box">
    <div class="front">
        <h3>hello world</h3>
    </div>
    <div class="back">
        <p>唱情歌齐齐来一遍</p>
        <p>无时无刻都记住掌声响遍天</p>
        <p>来唱情歌由从头再一遍</p>
        <p>如情浓有点泪流难避免</p>
    </div>
</div>
</body>
</html>
