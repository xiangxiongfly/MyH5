<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D悬停相册</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a252c;
        }

        .box {
            margin: 200px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box .item {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 2px;
            cursor: pointer;
            -webkit-box-reflect: below 1px linear-gradient(transparent, #0002);
            transition: all .6s;
        }

        .box .item img {
            width: 100%;
            height: 100%;
            border-radius: 5px;
            object-fit: cover;
        }

        .box .item:hover {
            transform: scale(1.2);
            z-index: 1;
        }

        .box:hover .item:not(:hover) {
            transform: perspective(500px) scale(0.9) rotateY(45deg);
            margin: 0 -20px;
            filter: blur(5px);
        }

        .box .item:hover ~ .item {
            transform: perspective(500px) scale(0.9) rotateY(-45deg);
        }
    </style>
</head>
<body>
<div class="box">
    <div class="item"><img src="../../../assets/images/cat/cat1.jpg" alt=""></div>
    <div class="item"><img src="../../../assets/images/cat/cat2.jpg" alt=""></div>
    <div class="item"><img src="../../../assets/images/cat/cat3.jpg" alt=""></div>
    <div class="item"><img src="../../../assets/images/cat/cat4.jpg" alt=""></div>
    <div class="item"><img src="../../../assets/images/cat/cat5.jpg" alt=""></div>
</div>
</body>
</html>
