<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>汽车滚动效果</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .box {
            position: relative;
            width: 1000px;
            height: 400px;
            border: 1px solid red;
            margin: 100px auto;
        }

        .car {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 400px;
            transition: all 3s cubic-bezier(0.65, 0.05, 0.36, 1);
        }

        .car .car-body {
            width: 100%;
        }

        .car .car-w-r, .car .car-w-l {
            position: absolute;
            top: 75px;
            right: 76px;
            width: 53px;
            transition: all 3s cubic-bezier(0.65, 0.05, 0.36, 1);
        }

        .car .car-w-l {
            right: 289px;
        }

        .box:hover .car {
            transform: translate(-600px, -50%);
        }

        .box:hover .car-w-r, .box:hover .car-w-l {
            transform: rotate(-360deg);
        }
    </style>
</head>
<body>
<div class="box">
    <div class="car">
        <img class="car-body" src="../../../assets/images/car/car.webp" alt="">
        <img class="car-w-r" src="../../../assets/images/car/wheel.webp" alt="">
        <img class="car-w-l" src="../../../assets/images/car/wheel.webp" alt="">
    </div>
</div>
</body>
</html>
