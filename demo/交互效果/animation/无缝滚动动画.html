<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>无缝滚动动画</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .box {
            overflow: hidden;
            width: 1180px;
            border: 1px solid red;
            margin: 100px auto;
        }

        .box:hover .scroll {
            animation-play-state: paused;
        }

        .scroll {
            display: flex;
            animation: anim 20s linear infinite;
        }

        .scroll img {
            width: 180px;
            height: 90px;
            border-radius: 6px;
            object-fit: contain;
        }

        .scroll .ad {
            display: grid;
            grid-template-columns: repeat(6, 180px);
            grid-template-rows: repeat(4, 90px);
            gap: 16px 20px;
            margin-right: 20px;
        }

        @keyframes anim {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(-1200px);
            }
        }
    </style>
</head>
<body>
<div class="box">
    <div class="scroll">
        <div class="ad">
